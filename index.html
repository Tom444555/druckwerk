<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Druckwerk">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Druckwerk</title>
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--text:#000;--sub:#6c6c70;--sep:rgba(60,60,67,.18);
  --blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--fill:rgba(120,120,128,.12);
  --kobrax:#5e5ce6;--c5pro:#ff9f0a;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000;--card:#1c1c1e;--text:#fff;--sub:#98989f;--sep:rgba(84,84,88,.6);
  --blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--fill:rgba(120,120,128,.24);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif}
main{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 16px 110px}
h1{font-size:34px;font-weight:700;letter-spacing:.3px;margin:8px 4px 14px}
h2{font-size:13px;font-weight:400;text-transform:uppercase;color:var(--sub);margin:22px 16px 7px}
.card{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:44px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.row .grow{flex:1;min-width:0}
.row .val{color:var(--sub);text-align:right}
.chev::after{content:"›";color:var(--sub);font-size:22px;margin-left:4px}
.small{font-size:13px;color:var(--sub)}
.badge{font-size:12px;font-weight:600;color:#fff;border-radius:6px;padding:2px 7px;white-space:nowrap}
.b-kobrax{background:var(--kobrax)}.b-c5pro{background:var(--c5pro)}
.dots{display:flex;gap:4px}.dot{width:14px;height:14px;border-radius:50%;border:.5px solid var(--sep)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.stat{background:var(--card);border-radius:12px;padding:12px}
.stat b{display:block;font-size:22px;font-weight:600}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font:600 17px -apple-system,sans-serif;
  background:var(--blue);color:#fff;text-align:center;text-decoration:none;cursor:pointer}
.btn.grey{background:var(--fill);color:var(--blue)}
.btn.rot{background:var(--fill);color:var(--red)}
.btn.rotvoll{background:var(--red);color:#fff}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;z-index:50}
.sheet>div{background:var(--bg);width:100%;max-width:640px;margin:0 auto;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 6px;font-size:17px;text-align:center}.sheet p{margin:0 0 14px;text-align:center;color:var(--sub);font-size:14px}
.sheet input{background:var(--card);border-radius:10px;padding:12px;margin-bottom:12px;box-sizing:border-box}
.sheet ol{margin:0 0 12px;padding-left:20px;font-size:14px;color:var(--sub)}
.btn+.btn{margin-top:10px}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;color:var(--text);font:500 14px -apple-system,sans-serif;
  padding:7px 4px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
textarea,input[type=text],select{width:100%;border:0;background:transparent;color:var(--text);
  font:17px -apple-system,sans-serif;outline:none}
textarea{min-height:90px;resize:vertical;padding:12px 16px}
select{appearance:none;-webkit-appearance:none;text-align:right;color:var(--blue);width:auto;max-width:60%}
input[type=color]{width:34px;height:34px;border:0;background:none;padding:0}
input[type=range]{flex:1;accent-color:var(--blue)}
.hint{margin:7px 16px 0;font-size:13px;color:var(--sub)}
.warn{margin:10px 0 0;padding:10px 14px;border-radius:12px;background:rgba(255,149,0,.15);font-size:15px}
pre.prompt{white-space:pre-wrap;font:15px/1.4 ui-monospace,Menlo,monospace;margin:0;padding:14px 16px}
#viewer{height:300px;background:linear-gradient(var(--card),var(--bg));border-radius:12px;position:relative}
#viewer .small{position:absolute;bottom:8px;left:12px}
.empty{text-align:center;color:var(--sub);padding:40px 20px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;
  background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:.5px solid var(--sep);padding:6px 0 calc(env(safe-area-inset-bottom) + 4px)}
nav button{flex:1;max-width:120px;min-width:0;padding:0;border:0;background:none;color:var(--sub);font:500 10px -apple-system,sans-serif;
  display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button svg{width:26px;height:26px}
nav button.on{color:var(--blue)}
.back{color:var(--blue);background:none;border:0;font:17px -apple-system,sans-serif;padding:8px 0;cursor:pointer}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;
  padding:10px 18px;border-radius:20px;font-size:15px;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
ol.steps{margin:0;padding:6px 16px 10px 38px}ol.steps li{padding:6px 0}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mk{background:var(--card);border-radius:12px;overflow:hidden;cursor:pointer}
.mk .mb{aspect-ratio:4/3;background:var(--fill)}.mk .mb img{width:100%;height:100%;object-fit:cover;display:block}
.mk .mt{padding:9px 11px 11px}.mk .mt b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mk .dots{margin-top:6px}
#wview{height:min(40vh,340px);background:var(--card);border-radius:12px;position:sticky;top:calc(env(safe-area-inset-top) + 6px);z-index:5;overflow:hidden;box-shadow:0 6px 14px rgba(0,0,0,.12)}
#wview .small{position:absolute;bottom:8px;left:12px;z-index:2;pointer-events:none}
.wrow{display:flex;gap:8px;margin-top:10px}
.wb{flex:1;border:0;border-radius:10px;padding:11px 6px;background:var(--card);color:var(--blue);font:600 15px -apple-system,sans-serif;cursor:pointer}
.wb:disabled{opacity:.35}.wb.an{background:var(--blue);color:#fff}.wb.klein{flex:none;padding:7px 12px;background:var(--fill)}
input.zahl{width:84px;text-align:right;background:var(--fill);border-radius:8px;padding:6px 8px}
.seg.mini{flex:none}.seg.mini button{padding:5px 9px}
.tname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.spule{border:0;background:none;color:var(--text);font:500 12px -apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
.spule span{width:40px;height:40px;border-radius:50%;border:.5px solid var(--sep);display:block}
.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.palette button{border:0;background:none;color:var(--text);font:500 11px -apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.palette span{width:38px;height:38px;border-radius:50%;border:.5px solid var(--sep);display:block}
.sheet>div{max-height:86vh;overflow:auto}
.balken{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}.balken i{display:block;height:100%;width:0;background:var(--blue);transition:width .6s}
.sheet h2{margin:16px 4px 7px}.sheet select{font-size:16px}
#sview{width:100%;aspect-ratio:1;background:#6b6b70;border-radius:12px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 2px}
.chip{border:0;border-radius:16px;padding:7px 13px;background:var(--card);color:var(--text);font:500 14px -apple-system,sans-serif;cursor:pointer}
.chip.on{background:var(--blue);color:#fff}
.werte{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.werte span,.pill{font-size:12px;background:var(--fill);border-radius:6px;padding:2px 7px;color:var(--text);font-weight:400}
.pill{white-space:nowrap}
.pr{font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;color:#fff;margin-left:6px;vertical-align:1px;white-space:nowrap}
.pr.p1{background:var(--red)}.pr.p2{background:var(--orange)}.pr.p3{background:var(--sub)}
.haken{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--sub);background:none;color:#fff;font:600 15px/1 -apple-system,sans-serif;cursor:pointer;padding:0;margin-top:1px}
.haken.on{background:var(--green);border-color:var(--green)}
.nr{flex:none;width:26px;height:26px;border-radius:50%;background:var(--fill);font:600 13px/26px -apple-system,sans-serif;text-align:center}
.row.oben{align-items:flex-start}
.row .val{overflow-wrap:anywhere}
ul.liste{margin:0;padding:8px 16px 8px 34px}ul.liste li{padding:5px 0;font-size:15px}
.sheet .row input,.sheet .row select{margin:0;padding:0;background:none;text-align:right;border-radius:0}
.seg+h2{margin-top:18px}
.seg.fuenf button{font-size:13px;padding:7px 1px;letter-spacing:-.2px}
.row.frage{display:block}
.frage textarea{min-height:64px;padding:6px 0 0}.frage .chips{margin:8px 0 0}.frage .chip{background:var(--fill)}.frage .chip.on{background:var(--blue)}
</style>
</head>
<body>
<main id="app"></main>

<nav>
  <button data-tab="bibliothek"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>Bibliothek</button>
  <button data-tab="auftraege" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7l8-4 8 4-8 4-8-4z"/><path d="M4 7v10l8 4 8-4V7"/><path d="M12 11v10"/></svg>Aufträge</button>
  <button data-tab="neu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Neu</button>
  <button data-tab="material"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><circle cx="11" cy="11" r="2.5"/><path d="M11 19h10"/></svg>Material</button>
  <button data-tab="drucker"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 8h16M9 13h6M12 8v5"/></svg>Drucker</button>
  <button data-tab="workflow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="6" r="2.2"/><circle cx="19" cy="18" r="2.2"/><path d="M7.2 6H14a3.5 3.5 0 0 1 0 7h-4a3.5 3.5 0 0 0 0 7h6.8"/></svg>Workflow</button>
</nav>
<div class="toast" id="toast"></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
const $ = s => document.querySelector(s);
const app = $("#app");
const DRUCKER = {};
let LAGER = [];        // alle Aufträge im Repo (auftraege/index.json)
let AUFTRAEGE = [];    // eigene, auf diesem Gerät gespeicherte Aufträge (wie die Ideen im Looper)
const SPEICHER = "druckwerk_meine";
let _speicherNotfall = null;   // falls das Gerät keinen Speicher erlaubt
const meineLaden = () => { try { return JSON.parse(localStorage.getItem(SPEICHER) || "[]"); } catch(e) { return _speicherNotfall || []; } };
const meineSichern = l => { _speicherNotfall = l; try { localStorage.setItem(SPEICHER, JSON.stringify(l)); } catch(e) {} };
let tab = "auftraege";

// Farbnamen -> Farbe (für Punkte und 3D-Vorschau)
const FARBEN = {weiss:"#f5f5f5",weiß:"#f5f5f5",schwarz:"#222",rot:"#e0352b",blau:"#2563eb",gruen:"#22a447",grün:"#22a447",
  gelb:"#f5c518",orange:"#f97316",grau:"#8e8e93",silber:"#c0c0c0",gold:"#d4a017",lila:"#8b5cf6",violett:"#8b5cf6",
  pink:"#ec4899",rosa:"#f9a8d4",braun:"#8b5a2b",tuerkis:"#14b8a6",türkis:"#14b8a6",natur:"#efe6d2",creme:"#f3e9c6",holz:"#b98a4e",transparent:"#cfe8ff"};
const farbe = n => FARBEN[(n||"").toLowerCase().trim()] || (/^#/.test(n||"") ? n : "#9a9aa0");
const uniq = v => [...new Set(String(v ?? "").split(","))].join(" / ");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast = t => { const e = $("#toast"); e.textContent = t; e.classList.add("show"); setTimeout(() => e.classList.remove("show"), 1600); };

async function laden(){
  for (const k of ["kobrax","c5pro"]) {
    try { DRUCKER[k] = await (await fetch(`drucker/${k}.json`, {cache:"no-store"})).json(); } catch(e) {}
  }
  try { LAGER = await (await fetch("auftraege/index.json", {cache:"no-store"})).json(); } catch(e) { LAGER = []; }
  AUFTRAEGE = meineLaden();
  // aktuelle Daten aus dem Lager übernehmen (falls neu gesliced)
  AUFTRAEGE = AUFTRAEGE.map(a => LAGER.find(x => x.ordner === a.ordner) || a);
  // Link von Claude: …/#hinzu=<ordner>[,<ordner>]
  const m = location.hash.match(/hinzu=([^&]+)/);
  if (m) {
    const neu = decodeURIComponent(m[1]).split(",").map(o => LAGER.find(x => x.ordner === o)).filter(Boolean);
    hinzufuegen(neu);
    history.replaceState(null, "", location.pathname);
    if (neu.length === 1) tab = "auftrag:" + neu[0].ordner;
    toast(neu.length ? (neu.length === 1 ? "Auftrag gespeichert" : neu.length + " Aufträge gespeichert") : "Auftrag nicht gefunden – evtl. 1 Min. warten");
  }
  meineSichern(AUFTRAEGE);
  zeige();
  try { if (localStorage.getItem("druckwerk_laeuft")) (await import("./werkstatt.js")).offenePruefen(wctx()); } catch(e) {}
}
function hinzufuegen(liste){
  for (const a of liste) if (!AUFTRAEGE.some(x => x.ordner === a.ordner)) AUFTRAEGE.unshift(a);
  AUFTRAEGE.sort((x,y) => (y.datum + y.ordner).localeCompare(x.datum + x.ordner));
  meineSichern(AUFTRAEGE);
}

function zeige(){
  const haupt = {auftrag:"auftraege", werkstatt:"bibliothek"}[tab.split(":")[0]] || tab.split(":")[0];
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === haupt));
  window.scrollTo(0,0);
  if (tab === "bibliothek" || tab.startsWith("werkstatt:")) return werkstattTab();
  if (tab === "auftraege") listeAuftraege();
  else if (tab.startsWith("auftrag:")) detail(tab.slice(8));
  else if (tab === "neu") neu();
  else if (["material","drucker","workflow"].includes(tab)) wissenTab();
  else { tab = "auftraege"; listeAuftraege(); }
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { tab = b.dataset.tab; zeige(); });

/* ---------- Bibliothek & Werkstatt (werkstatt.js) ---------- */
const wctx = () => ({LAGER, DRUCKER, FARBEN, farbe, esc, toast, sheet, go: t => { tab = t; zeige(); },
  fertig: (ordner, liste) => { LAGER = liste; hinzufuegen(LAGER.filter(a => a.ordner === ordner)); tab = "auftrag:" + ordner; zeige(); toast("Druckdatei ist fertig"); }});
async function werkstattTab(){
  const meinTab = tab;
  if (!app.querySelector("#wview")) app.innerHTML = `<h1>${tab === "bibliothek" ? "Bibliothek" : "Werkstatt"}</h1><div class="empty">Wird geladen …</div>`;
  try {
    const W = await import("./werkstatt.js");
    if (tab !== meinTab) return;
    const ctx = wctx();
    if (tab === "bibliothek") await W.bibliothek(app, ctx); else await W.werkstatt(app, ctx, tab.slice(10));
  } catch(e) { console.error(e); app.innerHTML = `<h1>Bibliothek</h1><div class="empty">Konnte nicht geladen werden – Internet prüfen.</div>`; }
}

/* ---------- Material, Drucker, Workflow (wissen.js + wissen/*.json) ---------- */
const kctx = () => ({DRUCKER, farbe, esc, toast, sheet, go: t => { tab = t; zeige(); },
  neuStart: (text, zweck, material, weg) => { if (text) F.text = text; if (zweck) F.zweck = zweck; F.drucker = "c5pro";
    if (material) F.slots[0].material = material; if (weg) { F.modus = "gefuehrt"; F.weg = weg; F._farben = ""; } tab = "neu"; zeige(); }});
async function wissenTab(){
  const meinTab = tab;
  try { const K = await import("./wissen.js"); if (tab !== meinTab) return; await K.seite(app, kctx(), tab); }
  catch(e) { console.error(e); app.innerHTML = `<h1>Druckwerk</h1><div class="empty">Konnte nicht geladen werden – Internet prüfen.</div>`; }
}

/* ---------- Aufträge ---------- */
const summeGramm = a => String(a.gramm).split(",").reduce((s,x) => s + (parseFloat(x)||0), 0);
function listeAuftraege(){
  const gesamt = AUFTRAEGE.reduce((s,a) => s + summeGramm(a), 0);
  let h = `<h1>Aufträge</h1>
  <div class="stats">
    <div class="stat"><span class="small">Aufträge</span><b>${AUFTRAEGE.length}</b></div>
    <div class="stat"><span class="small">Filament</span><b>${gesamt.toFixed(0)} g</b></div>
    <div class="stat"><span class="small">Drucker</span><b>2</b></div>
  </div>`;
  if (!AUFTRAEGE.length) h += `<div class="empty">Noch keine Aufträge gespeichert.<br>Unter „Neu“ einen Auftrag zusammenstellen – Claude schickt dir danach einen Link, der ihn hier speichert.</div>`;
  else {
    h += `<h2>Neueste zuerst</h2><div class="card">`;
    for (const a of AUFTRAEGE) h += `
      <div class="row chev" data-o="${esc(a.ordner)}" style="cursor:pointer">
        <div class="grow"><div><b>${esc(a.name)}</b></div>
          <div class="small">${esc(a.datum)} · ${esc(a.zeit)} · ${summeGramm(a).toFixed(1)} g</div></div>
        <div class="dots">${a.slots.map(s => `<span class="dot" style="background:${farbe(s.farbe)}"></span>`).join("")}</div>
        <span class="badge b-${a.drucker}">${a.drucker === "kobrax" ? "Kobra X" : "C5 Pro"}</span>
      </div>`;
    h += `</div>`;
  }
  const offen = LAGER.filter(x => !AUFTRAEGE.some(a => a.ordner === x.ordner));
  if (offen.length) h += `<div style="height:16px"></div><button class="btn grey" id="lager">Aus dem Lager hinzufügen (${offen.length})</button>`;
  app.innerHTML = h;
  app.querySelectorAll("[data-o]").forEach(r => r.onclick = () => { tab = "auftrag:" + r.dataset.o; zeige(); });
  const l = $("#lager"); if (l) l.onclick = () => lagerZeigen(offen);
}

function detail(ordner){
  const a = AUFTRAEGE.find(x => x.ordner === ordner);
  if (!a) { tab = "auftraege"; return zeige(); }
  const pfad = `auftraege/${a.ordner}/`;
  const gr = String(a.gramm).split(",");
  app.innerHTML = `
  <button class="back" id="zur">‹ Aufträge</button>
  <h1>${esc(a.name)}</h1>
  <div id="viewer">${a.vorschau ? `<img id="vbild" src="${pfad}${esc(a.vorschau)}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:12px">` : ""}
    <span class="small" id="vtext" style="position:absolute;left:12px;bottom:10px">3D-Modell wird geladen …</span></div>
  <div class="stats">
    <div class="stat"><span class="small">Druckzeit</span><b>${esc(a.zeit)}</b></div>
    <div class="stat"><span class="small">Filament</span><b>${summeGramm(a).toFixed(1)} g</b></div>
    <div class="stat"><span class="small">Schicht</span><b>${esc(a.schicht)}</b></div>
  </div>
  <h2>Drucker</h2>
  <div class="card"><div class="row"><div class="grow">${esc(a.drucker_name)}</div>
    <span class="badge b-${a.drucker}">${a.drucker === "kobrax" ? "Kobra X" : "C5 Pro"}</span></div></div>
  <h2>${a.drucker === "kobrax" ? "Spulen einlegen" : "Köpfe bestücken"}</h2>
  <div class="card">${a.slots.map((s,i) => `
    <div class="row"><span class="dot" style="background:${farbe(s.farbe)};width:22px;height:22px"></span>
      <div class="grow">${a.drucker === "kobrax" ? "Spule" : "Kopf"} ${s.slot}: <b>${esc(s.material)}</b> ${esc(s.farbe)}</div>
      <span class="val">${(parseFloat(gr[i])||0).toFixed(1)} g</span></div>`).join("")}
  </div>
  ${a.gemischt ? `<div class="warn">⚠ Unterschiedliche Materialien – Haftung und Temperaturen prüfen.</div>` : ""}
  <div id="fcheck"></div>
  <h2>Einstellungen</h2>
  <div class="card">
    <div class="row"><div class="grow">Schichthöhe</div><span class="val">${esc(a.schicht)} mm (${esc(a.stufe)})</span></div>
    <div class="row"><div class="grow">Füllung</div><span class="val">${esc(a.infill)} %</span></div>
    <div class="row"><div class="grow">Wände</div><span class="val">${esc(a.waende ?? "Standard")}</span></div>
    <div class="row"><div class="grow">Stützen</div><span class="val">${esc(a.stuetzen)}</span></div>
    <div class="row"><div class="grow">Brim</div><span class="val">${esc(a.brim)}</span></div>
    <div class="row"><div class="grow">Düse / Bett</div><span class="val">${esc(uniq(a.duese))} °C · ${esc(uniq(a.bett))} °C</span></div>
  </div>
  <h2>Datei für den USB-Stick</h2>
  <a class="btn" href="${pfad}${encodeURIComponent(a.gcode)}" download="${esc(a.gcode)}">${esc(a.gcode)} laden</a>
  <button class="btn grey" id="schichten">Schichten ansehen</button>
  <button class="btn grey" id="inWerk">In der Werkstatt umbauen</button>
  <button class="btn grey" id="buchen">Verbrauch vom Filamentlager abbuchen</button>
  ${a.projekt ? `<a class="btn grey" href="${pfad}${encodeURIComponent(a.projekt)}" download="${esc(a.projekt)}">3MF-Projekt laden (für ${a.drucker === "kobrax" ? "Anycubic Slicer" : "Flash Studio"} / OrcaSlicer)</a>` : ""}
  <a class="btn grey" href="${pfad}BERICHT.md" target="_blank">Bericht öffnen</a>
  ${a.quelle ? `<a class="btn grey" href="${esc(a.quelle)}" target="_blank" rel="noopener">Original auf ${esc(quellName(a.quelle))} öffnen</a>` : ""}
  <p class="hint">Datei auf einen FAT32-USB-Stick kopieren → am Drucker unter USB auswählen → Platte frei? → Start.</p>
  <div id="tbAuf"></div>
  <h2>Verwalten</h2>
  <button class="btn rot" id="loeschen">Auftrag löschen</button>
  <div style="height:20px"></div>`;
  $("#zur").onclick = () => { tab = "auftraege"; zeige(); };
  $("#inWerk").onclick = () => { tab = "werkstatt:l:" + a.ordner; zeige(); };
  $("#schichten").onclick = async () => { try { (await import("./schichten.js")).zeigen(pfad + encodeURIComponent(a.gcode), a.slots.map(s => farbe(s.farbe)), sheet); } catch(e) { toast("Konnte nicht geladen werden"); } };
  const check = async () => { try { const el = $("#fcheck"); if (el) el.innerHTML = (await import("./wissen.js")).filamentCheck(a, kctx()); } catch(e) {} };
  check();
  $("#buchen").onclick = async () => { try { (await import("./wissen.js")).abbuchen(a, {...kctx(), fertig: check}); } catch(e) { toast("Konnte nicht geladen werden"); } };
  import("./tagebuch.js").then(T => { const el = $("#tbAuf"); if (el) T.imAuftrag(el, a, kctx()); }).catch(() => {});
  $("#loeschen").onclick = () => loeschenFragen(a);
  vorschau(pfad, a);
}

async function vorschau(pfad, a){
  const el = $("#viewer");
  try {
    const THREE = await import("three");
    const { STLLoader } = await import("three/addons/loaders/STLLoader.js");
    const { OrbitControls } = await import("three/addons/controls/OrbitControls.js");
    const w = el.clientWidth, h = el.clientHeight;
    const r = new THREE.WebGLRenderer({antialias:true, alpha:true});
    r.setPixelRatio(Math.min(devicePixelRatio, 2)); r.setSize(w,h);
    r.domElement.style.cssText = "position:absolute;inset:0;border-radius:12px";
    const sc = new THREE.Scene();
    sc.add(new THREE.HemisphereLight(0xffffff, 0x666666, 1.6));
    const dl = new THREE.DirectionalLight(0xffffff, 1.4); dl.position.set(1,2,1.5); sc.add(dl);
    const cam = new THREE.PerspectiveCamera(40, w/h, 0.1, 5000);
    const grp = new THREE.Group(); sc.add(grp);
    const ld = new STLLoader();
    const vt = $("#vtext");
    const teile = a.teile_app || a.teile;          // leichte Kopien fürs Handy, falls vorhanden
    for (const [i, t] of teile.entries()) {
      const geo = await ld.loadAsync(pfad + encodeURIComponent(t.datei), ev => {
        if (vt && ev.total) vt.textContent = `3D-Modell wird geladen … Teil ${i+1}/${teile.length} · ${Math.round(100*ev.loaded/ev.total)} %`; });
      geo.computeVertexNormals();
      const slot = a.slots.find(s => s.slot === t.slot) || {};
      grp.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color: farbe(slot.farbe), roughness:.6})));
    }
    grp.rotation.x = -Math.PI/2;           // Z nach oben (Druckkoordinaten)
    const box = new THREE.Box3().setFromObject(grp), c = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3()).length();
    grp.position.sub(c);
    cam.position.set(size*.8, size*.6, size*.9); cam.lookAt(0,0,0);
    const ctl = new OrbitControls(cam, r.domElement); ctl.enableDamping = true; ctl.autoRotate = true; ctl.autoRotateSpeed = 1.5;
    // Bild erst entfernen, wenn das 3D-Modell wirklich gezeichnet wurde; bei Grafikproblemen zurück zum Bild
    r.domElement.style.opacity = "0"; el.appendChild(r.domElement);
    r.domElement.addEventListener("webglcontextlost", e => { e.preventDefault(); r.domElement.remove();
      const vb = $("#vbild"); if (vb) vb.style.display = ""; if (vt) vt.textContent = "Bild-Vorschau (3D zu groß für dieses Gerät)"; });
    r.render(sc, cam);
    requestAnimationFrame(() => { r.domElement.style.opacity = "1"; const vb = $("#vbild"); if (vb) vb.style.display = "none";
      if (vt) vt.textContent = "3D-Vorschau · drehen mit Finger"; });
    (function lauf(){ if (!document.body.contains(r.domElement)) return; ctl.update(); r.render(sc,cam); requestAnimationFrame(lauf); })();
  } catch(e) { const vt = $("#vtext"); if (vt) vt.textContent = $("#vbild") ? "Bild-Vorschau (3D nicht verfügbar)" : "Vorschau nicht verfügbar"; }
}

/* ---------- Neuer Auftrag (erzeugt den Prompt für Claude) ---------- */
const F = { drucker:"c5pro", text:"", link:"", zweck:"deko", qualitaet:"standard", stuetzen:"auto",
  slots:[{material:"PLA", farbe:"schwarz"}], modus:"frei", weg:"technik", antw:{}, _farben:"" };
let WF = null;   // wissen/workflow.json – Wege und Fragen für den geführten Auftrag
const ANHANG = {technik:"Fotos mit Maßband hänge ich an.", kunst:"Fotos als Stilvorlage hänge ich an.",
  fertig:"STL/3MF hänge ich an, falls der Link nicht reicht.", foto:"Bild und KI-Datei (STL/GLB/3MF) hänge ich an.", scan:"Scan-Datei (OBJ/STL) und Fotos hänge ich an."};
function neu(){
  if (F.modus === "gefuehrt" && !WF) {
    app.innerHTML = `<h1>Neuer Auftrag</h1><div class="empty">Wird geladen …</div>`;
    fetch("wissen/workflow.json", {cache:"no-store"}).then(r => r.json()).then(w => { WF = w; if (tab === "neu") neu(); })
      .catch(() => { F.modus = "frei"; toast("Fragen konnten nicht geladen werden"); if (tab === "neu") neu(); });
    return;
  }
  const gef = F.modus === "gefuehrt";
  if (gef) F.drucker = "c5pro";
  const weg = gef ? (WF.wege.find(x => x.id === F.weg) || WF.wege[0]) : null;
  const fragen = weg ? (weg.fragen || []) : [];
  if (weg) {
    F.weg = weg.id;
    const fv = fragen.find(q => q.typ === "farben" && q.vorgabe);   // Farbvorgabe des Wegs (Kunst) einmal übernehmen
    if (fv && F._farben !== weg.id && F.slots.length === 1) F.slots = fv.vorgabe.slice(0, 4).map(f => ({material:F.slots[0].material, farbe:f}));
    F._farben = weg.id;
  }
  const A = weg ? (F.antw[weg.id] = F.antw[weg.id] || {}) : {};
  const wert = q => A[q.id] ?? (q.typ === "schalter" ? !!q.standard : "");
  const d = DRUCKER[F.drucker] || {filamente:{PLA:1}};
  const mats = Object.keys(d.filamente);
  F.slots.forEach(s => { if (!mats.includes(s.material)) s.material = "PLA"; });
  const seg = (k, opts) => `<div class="seg">${opts.map(([v,l]) => `<button data-k="${k}" data-v="${v}" class="${F[k]===v?"on":""}">${l}</button>`).join("")}</div>`;
  const hitze = F.slots.some(s => /ABS|ASA|PA/.test(s.material));
  const frage = q => {
    const ph = esc(q.platzhalter || ""), lab = `<div class="small">${esc(q.label)}</div>`;
    if (q.typ === "farben") return "";   // steht unten unter „Farben & Material“
    if (q.typ === "lang") return `<label class="row frage">${lab}<textarea data-q="${q.id}" placeholder="${ph}">${esc(wert(q))}</textarea></label>`;
    if (q.typ === "wahl") return `<div class="row frage">${lab}<div class="chips">${q.optionen.map(o =>
      `<button class="chip ${wert(q) === o ? "on" : ""}" data-qw="${q.id}" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div></div>`;
    if (q.typ === "schalter") return `<div class="row"><div class="grow">${esc(q.label)}</div>
      <button class="haken ${wert(q) ? "on" : ""}" data-qs="${q.id}" aria-label="${esc(q.label)}">${wert(q) ? "✓" : ""}</button></div>`;
    if (q.typ === "zahl") return `<div class="row"><div class="grow">${esc(q.label)}</div>
      <input type="text" inputmode="decimal" class="zahl" data-q="${q.id}" value="${esc(wert(q))}" placeholder="${ph}"><span class="small" style="width:26px">${esc(q.einheit || "")}</span></div>`;
    return `<label class="row frage">${lab}<input type="text" data-q="${q.id}" value="${esc(wert(q))}" placeholder="${ph}" style="margin-top:4px"></label>`;
  };
  const farbFrage = fragen.find(q => q.typ === "farben");
  const draussen = gef && /draußen|Auto|Hitze/.test(A.ort || "") && F.slots.some(s => /PLA/.test(s.material));
  const modelleFinden = `<h2>Modelle finden</h2>
  <div class="card">${[["MakerWorld","https://makerworld.com/de"],["Printables","https://www.printables.com"],["Thangs (sucht überall)","https://thangs.com"],
    ["MyMiniFactory – Scan the World","https://www.myminifactory.com/scantheworld/"],["Thingiverse","https://www.thingiverse.com"]].map(([n,u]) =>
    `<a class="row chev" href="${u}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none"><div class="grow">${n}</div></a>`).join("")}</div>`;
  app.innerHTML = `
  <h1>Neuer Auftrag</h1>
  ${seg("modus", [["frei","Frei"],["gefuehrt","Geführt"]])}
  ${gef ? `
  <h2>Womit fängst du an?</h2><div class="chips">${WF.wege.map(x => `<button class="chip ${x.id === weg.id ? "on" : ""}" data-weg="${x.id}">${esc(x.name)}</button>`).join("")}</div>
  <p class="hint">${esc(weg.kurz)} Nur ausfüllen, was du weißt – leere Felder fragt Claude nach.</p>
  <h2>${esc(weg.name)}</h2><div class="card">${fragen.map(frage).join("")}</div>
  ${weg.id === "fertig" ? modelleFinden : ""}` : `
  <h2>Drucker</h2>${seg("drucker", [["c5pro","Creator 5 Pro"],["kobrax","Kobra X (früher)"]])}
  ${hitze && F.drucker === "kobrax" ? `<div class="warn">ABS/ASA/Nylon besser auf dem geschlossenen Creator 5 Pro drucken.</div>` : ""}
  <h2>Was soll gedruckt werden?</h2>
  <div class="card"><textarea id="txt" placeholder="z. B. Wandhalter für 3 Schraubendreher, 2 Schrauben, Logo vorne">${esc(F.text)}</textarea>
    <div class="row"><input type="text" id="lnk" placeholder="Link zu Modell (optional)" value="${esc(F.link)}"></div></div>
  <p class="hint">Fertiges Modell gefunden? Link oben einfügen – Claude lädt nichts selbst herunter, schick die STL-Datei bei Bedarf mit.</p>
  ${modelleFinden}`}
  <h2>${gef && farbFrage ? esc(farbFrage.label.replace(/\s*\(.*\)/, "")) + " &amp; Material" : "Farben &amp; Material"} (${F.slots.length}/4)</h2>
  <div class="card">${F.slots.map((s,i) => `
    <div class="row"><span class="dot" style="background:${farbe(s.farbe)};width:22px;height:22px"></span>
      <input type="text" data-f="${i}" value="${esc(s.farbe)}" style="flex:1" placeholder="Farbe">
      <select data-m="${i}">${mats.map(m => `<option ${m===s.material?"selected":""}>${m}</option>`).join("")}</select>
      ${F.slots.length > 1 ? `<button class="back" data-x="${i}" style="color:var(--red)">−</button>` : ""}</div>`).join("")}
    ${F.slots.length < 4 ? `<div class="row"><button class="back" id="plus">＋ Farbe hinzufügen</button></div>` : ""}
  </div>
  ${draussen ? `<div class="warn">Für ${esc(A.ort)} besser ASA statt PLA wählen – PLA wird ab etwa 55 °C weich.</div>` : ""}
  <h2>Zweck</h2>${seg("zweck", [["deko","Deko/Figur"],["funktion","Funktionsteil"],["stabil","Sehr stabil"]])}
  <h2>Qualität</h2>${seg("qualitaet", [["fein","Fein"],["standard","Standard"],["schnell","Schnell"]])}
  <h2>Stützen</h2>${seg("stuetzen", [["aus","Keine"],["auto","Automatisch"],["baum","Baum"]])}
  <h2>Auftrag für Claude</h2>
  <div class="card"><pre class="prompt" id="pr"></pre></div>
  <p class="hint">Kopieren und an Claude schicken – du bekommst die fertige .gcode-Datei und einen Link zurück, der den Auftrag unter „Aufträge“ speichert.</p>
  <button class="btn" id="kop" style="margin-top:12px">Auftrag kopieren</button>
  <a class="btn grey" id="oeffnen" target="_blank">In Claude öffnen</a>`;
  const prompt = () => {
    const sch = {kobrax:{fein:"0.12",standard:"0.20",schnell:"0.28"}, c5pro:{fein:"0.12",standard:"0.20",schnell:"0.24"}}[F.drucker][F.qualitaet];
    const z = {deko:"Deko – 15 % Füllung", funktion:"Funktionsteil – 30 % Füllung, 4 Wände", stabil:"sehr stabil – 50 % Füllung, 5 Wände"}[F.zweck];
    const st = {aus:"keine Stützen", auto:"Stützen automatisch", baum:"Baumstützen"}[F.stuetzen];
    const koepfe = F.slots.map((s,i) => `${F.drucker==="kobrax"?"Spule":"Kopf"} ${i+1}: ${s.material} ${s.farbe}`).join("\n");
    if (gef) {
      const zeilen = fragen.filter(q => q.typ !== "farben").map(q => { const v = wert(q);
        if (q.typ === "schalter") return v ? (q.text || q.label) : "";
        const s = String(v).trim(); return s ? `${q.label.replace(/\?$/, "")}: ${s}${q.einheit ? " " + q.einheit : ""}` : ""; }).filter(Boolean);
      return `druckwerk: ${weg.name} (geführter Auftrag)\nDrucker: ${d.name || "Creator 5 Pro"}\n` + (zeilen.length ? zeilen.join("\n") + "\n" : "") +
        koepfe + `\nZweck: ${z}\nSchicht: ${sch} mm, ${st}\n` + (ANHANG[weg.id] || "Fotos/Dateien hänge ich an.");
    }
    return `druckwerk: ${F.text || "…"}\n` + (F.link ? `Modell: ${F.link}\n` : "") +
      `Drucker: ${d.name || F.drucker}\n` + koepfe + `\nZweck: ${z}\nSchicht: ${sch} mm, ${st}`;
  };
  const aktuell = () => { $("#pr").textContent = prompt(); $("#oeffnen").href = "https://claude.ai/new?q=" + encodeURIComponent(prompt()); };
  aktuell();
  app.querySelectorAll(".seg button").forEach(b => b.onclick = () => { F[b.dataset.k] = b.dataset.v; neu(); });
  const txt = $("#txt"); if (txt) txt.oninput = e => { F.text = e.target.value; aktuell(); };
  const lnk = $("#lnk"); if (lnk) lnk.oninput = e => { F.link = e.target.value; aktuell(); };
  app.querySelectorAll("[data-weg]").forEach(b => b.onclick = () => { const w = WF.wege.find(x => x.id === b.dataset.weg);
    F.weg = w.id; if (w.zweck) F.zweck = w.zweck; neu(); });
  app.querySelectorAll("[data-q]").forEach(e => e.oninput = () => { A[e.dataset.q] = e.value; aktuell(); });
  app.querySelectorAll("[data-qw]").forEach(b => b.onclick = () => { A[b.dataset.qw] = A[b.dataset.qw] === b.dataset.v ? "" : b.dataset.v; neu(); });
  app.querySelectorAll("[data-qs]").forEach(b => b.onclick = () => { const q = fragen.find(x => x.id === b.dataset.qs); A[q.id] = !wert(q); neu(); });
  app.querySelectorAll("[data-f]").forEach(e => e.onchange = () => { F.slots[e.dataset.f].farbe = e.value; neu(); });
  app.querySelectorAll("[data-m]").forEach(e => e.onchange = () => { F.slots[e.dataset.m].material = e.value; neu(); });
  app.querySelectorAll("[data-x]").forEach(e => e.onclick = () => { F.slots.splice(+e.dataset.x, 1); neu(); });
  const p = $("#plus"); if (p) p.onclick = () => { F.slots.push({material:F.slots[0].material, farbe:""}); neu(); };
  $("#kop").onclick = async () => { try { await navigator.clipboard.writeText(prompt()); toast("Kopiert"); } catch(e) { toast("Bitte markieren und kopieren"); } };
}

/* ---------- Löschen (nur auf diesem Gerät) & Lager ---------- */
const quellName = u => { try { const h = new URL(u).hostname.replace(/^www\./, "");
  return {"makerworld.com":"MakerWorld","printables.com":"Printables","thingiverse.com":"Thingiverse","thangs.com":"Thangs",
          "myminifactory.com":"MyMiniFactory","cults3d.com":"Cults3D","cgtrader.com":"CGTrader","sketchfab.com":"Sketchfab"}[h] || h; }
  catch(e) { return "Webseite"; } };
function sheet(html){
  const d = document.createElement("div"); d.className = "sheet"; d.innerHTML = `<div>${html}</div>`;
  d.onclick = e => { if (e.target === d) d.remove(); };
  document.body.appendChild(d); return d;
}
function loeschenFragen(a){
  const d = sheet(`<h3>„${esc(a.name)}“ löschen?</h3><p>${esc(a.datum)} · ${esc(a.drucker_name)}<br>Der Auftrag wird aus deiner Liste entfernt.</p>
    <button class="btn rotvoll" id="jaL">Löschen</button><button class="btn grey" id="neinL">Abbrechen</button>`);
  d.querySelector("#neinL").onclick = () => d.remove();
  d.querySelector("#jaL").onclick = () => {
    AUFTRAEGE = AUFTRAEGE.filter(x => x.ordner !== a.ordner); meineSichern(AUFTRAEGE);
    d.remove(); tab = "auftraege"; zeige(); toast("Gelöscht");
  };
}
function lagerZeigen(offen){
  const d = sheet(`<h3>Aus dem Lager hinzufügen</h3><p>Aufträge, die Claude erstellt hat und die noch nicht in deiner Liste sind.</p>
    <div class="card" style="max-height:50vh;overflow:auto">${offen.map(a => `
      <div class="row" data-h="${esc(a.ordner)}" style="cursor:pointer"><div class="grow"><b>${esc(a.name)}</b>
        <div class="small">${esc(a.datum)} · ${a.drucker === "kobrax" ? "Kobra X" : "C5 Pro"} · ${esc(a.zeit)}</div></div>
        <span style="color:var(--blue);font-size:24px">＋</span></div>`).join("")}</div>
    <div style="height:12px"></div><button class="btn grey" id="zuL">Fertig</button>`);
  d.querySelector("#zuL").onclick = () => { d.remove(); zeige(); };
  d.querySelectorAll("[data-h]").forEach(r => r.onclick = () => {
    hinzufuegen([LAGER.find(x => x.ordner === r.dataset.h)]); r.remove(); toast("Hinzugefügt");
    if (!d.querySelector("[data-h]")) { d.remove(); zeige(); } });
}

window.addEventListener("hashchange", () => { if (/hinzu=/.test(location.hash)) laden(); });
